---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile.json

# This helmfile is for extracting and installing Custom Resource Definitions (CRDs) from Helm charts.
# It is not intended to be used with helmfile apply or helmfile sync.

helmDefaults:
  args:
    - --include-crds
    - --no-hooks

releases:
  - name: external-dns-cloudflare
    namespace: network
    chart: oci://ghcr.io/home-operations/charts-mirror/external-dns
    version: 1.21.1

  - name: envoy-gateway
    namespace: network
    chart: oci://mirror.gcr.io/envoyproxy/gateway-helm
    version: 1.9.1

  - name: grafana-operator
    namespace: observability
    chart: oci://ghcr.io/grafana/helm-charts/grafana-operator
    version: 5.25.0

  - name: keda
    namespace: observability
    chart: oci://ghcr.io/home-operations/charts-mirror/keda
    version: 2.20.2

  # CRDs only (this stage extracts the CustomResourceDefinition kind and discards
  # the rest) — the kube-prometheus-stack release itself is not installed; the
  # cluster runs VictoriaMetrics instead. Kept because monitoring.coreos.com CRDs
  # (ServiceMonitor, PodMonitor, PrometheusRule, Probe, ...) are still consumed
  # throughout the repo and converted by the VM operator.
  - name: kube-prometheus-stack
    namespace: observability
    chart: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    version: 88.6.1

  - name: victoria-metrics-k8s-stack
    namespace: observability
    chart: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-k8s-stack
    version: 0.91.2

  - name: silence-operator
    namespace: observability
    chart: oci://gsoci.azurecr.io/charts/giantswarm/silence-operator
    version: 0.20.1

  - name: kopiur
    namespace: kopiur-system
    chart: oci://ghcr.io/home-operations/charts/kopiur
    version: 0.10.6
