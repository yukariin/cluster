---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/autoscaling/horizontalpodautoscaler_v2.json
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: "${APP}-nfs-scaler"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: ${NFS_KIND:=Deployment}
    name: "${APP}"
  minReplicas: 0
  maxReplicas: 1
  metrics:
    - type: External
      external:
        metric:
          name: ${ZEROSCALER_METRIC_NAME:=probe_success}
          selector:
            matchLabels:
              job: ${ZEROSCALER_JOB_NAME:=nfs_probe}
        target:
          type: Value
          value: "1"
  behavior:
    scaleDown:
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
      selectPolicy: Max
      stabilizationWindowSeconds: 0
    scaleUp:
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
      selectPolicy: Max
      stabilizationWindowSeconds: 0
