---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: towonel-agent
spec:
  endpoints:
    # DNS-only (grey cloud): agents/edges dial the hub over QUIC and clients
    # need direct TLS-passthrough connects, neither survives the CF proxy.
    - dnsName: hub.mistelinn.org
      recordType: A
      targets:
        - ${VPS_IP}
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
