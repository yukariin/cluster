---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-cloudflare
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      external-dns-cloudflare:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: registry.k8s.io/external-dns/external-dns
              tag: v0.22.0@sha256:5fdcaf7deb5c158f93a1fc6fe169cdff4cfb9ae0172bee1a90ab0ef74fb9c9cf
            args:
              - --cloudflare-dns-records-per-page=1000
              - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
              - --crd-source-kind=DNSEndpoint
              - --domain-filter=mistelinn.org
              - --events
              - --gateway-name=envoy-external
              - --interval=1m
              - --log-format=text
              - --log-level=info
              - --policy=sync
              - --provider=cloudflare
              - --registry=txt
              - --source=crd
              - --source=gateway-httproute
              - --txt-owner-id=k8s
              - --txt-prefix=k8s.
              - --zone-id-filter=$(CF_ZONE_ID)
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 7979
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
    rbac:
      roles:
        external-dns-cloudflare:
          type: ClusterRole
          rules:
            - apiGroups:
                - ""
              resources:
                - "namespaces"
              verbs:
                - "get"
                - "watch"
                - "list"
            - apiGroups:
                - "gateway.networking.k8s.io"
              resources:
                - "httproutes"
                - "gateways"
              verbs:
                - "get"
                - "watch"
                - "list"
            - apiGroups:
                - "externaldns.k8s.io"
              resources:
                - "dnsendpoints"
              verbs:
                - "get"
                - "watch"
                - "list"
            - apiGroups:
                - "externaldns.k8s.io"
              resources:
                - "dnsendpoints/status"
              verbs:
                - "update"
      bindings:
        external-dns-cloudflare:
          type: ClusterRoleBinding
          roleRef:
            identifier: external-dns-cloudflare
          subjects:
            - identifier: external-dns-cloudflare
    serviceAccount:
      external-dns-cloudflare: {}
