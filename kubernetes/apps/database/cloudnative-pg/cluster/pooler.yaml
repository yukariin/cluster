---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/pooler_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pooler-rw
spec:
  cluster:
    name: postgres
  instances: 2
  type: rw

  template:
    spec:
      containers: []
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  cnpg.io/poolerName: pooler-rw
              topologyKey: kubernetes.io/hostname

  pgbouncer:
    poolMode: session

    authQuery: "SELECT $1, NULL"
    clientCASecret:
      name: pooler-client-cert
    clientTLSSecret:
      name: pooler-server-cert
    serverCASecret:
      name: pooler-server-cert
    serverTLSSecret:
      name: pooler-client-cert

    parameters:
      auth_type: cert # Require TLS client certificate auth for incoming clients.
      client_tls_sslmode: verify-full # Verify PgBouncer -> Postgres server cert + hostname.
      server_tls_sslmode: verify-full # Verify app -> PgBouncer server cert + hostname.

      max_client_conn: "1000" # Maximum number of client connections accepted by PgBouncer.
      default_pool_size: "15" # Default number of server connections per database/user pool.

      # timeouts / hygiene
      server_idle_timeout: "300" # Close idle PgBouncer -> Postgres server connections after 5m.
      server_login_retry: "5" # Wait 5s before retrying backend login after connection failure.

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: &name pooler-rw
spec:
  podMetricsEndpoints:
    - port: metrics
  selector:
    matchLabels:
      cnpg.io/poolerName: *name
