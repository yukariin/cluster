---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg
spec:
  groups:
    - name: cloudnative-pg.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: "{{ $value }} backends on pod {{ $labels.pod }} have been blocked waiting on locks for over 5 minutes."
            summary: Sustained lock contention on the database.
          expr: |-
            cnpg_backends_waiting_total > 5
          for: 5m
          labels:
            severity: warning
        - alert: PGDatabase
          annotations:
            description: Over 150,000,000 transactions from frozen xid on pod {{ $labels.pod }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 150000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 300 seconds (5 minutes)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary: Checks the last time archiving failed. Will be < 0 when it has not failed.
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: "Deadlocks are occurring on pod {{ $labels.pod }} ({{ $value | humanize }} deadlocks/s over the last 5 minutes)."
            summary: Sustained deadlock activity on the database.
          expr: |-
            rate(cnpg_pg_stat_database_deadlocks[5m]) > 0
          for: 5m
          labels:
            severity: warning
        - alert: ReplicaFailingReplication
          annotations:
            description: Replica {{ $labels.pod }} is failing to replicate
            summary: Checks if the replica is failing to replicate
          expr: |-
            cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
          for: 1m
          labels:
            severity: warning
        - alert: BarmanCloudBackupStale
          annotations:
            description: No successful backup for {{ $labels.pod }} in over 36h (last success {{ $value | humanizeDuration }} ago).
            summary: Barman Cloud has not produced a successful backup recently.
          expr: |-
            time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp > 36 * 3600
          for: 15m
          labels:
            severity: warning
        - alert: BarmanCloudBackupFailed
          annotations:
            description: A Barman Cloud backup failed for {{ $labels.pod }} within the last hour.
            summary: Recent Barman Cloud backup failure.
          expr: |-
            time() - barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp < 3600
          for: 5m
          labels:
            severity: warning
