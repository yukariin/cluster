---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cloudnative-pg
spec:
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg
  interval: 1h
  values:
    monitoring:
      podMonitorEnabled: true
      grafanaDashboard:
        create: false # stale bundled snapshot; dashboard tracks upstream via GrafanaDashboard url

    resources:
      requests:
        cpu: 15m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi

    replicaCount: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: *app
            topologyKey: kubernetes.io/hostname
