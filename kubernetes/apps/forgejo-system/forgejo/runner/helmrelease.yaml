---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      forgejo-runner:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            app.kubernetes.io/component: forgejo-runner
          securityContext:
            runAsNonRoot: true
            runAsGroup: 568
            runAsUser: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
          # must cover runner.shutdown_timeout plus the plugin's 60s cleanup budget
          terminationGracePeriodSeconds: 300
        initContainers:
          # native sidecar: started before, and terminated after, the runner
          # container, so the plugin socket outlives job draining on shutdown
          k8s-plugin:
            image:
              repository: registry.erwanleboucher.dev/erwanleboucher.dev/eleboucher/runner-k8s-plugin
              tag: 13.2.1@sha256:d62811841a20fd1a311b2c90c6ffcec37d09e52ebb46834b0c04f3ad2a3bcbe7
            args:
              - --listen
              - unix:///plugin/forgejo-runner-k8s.sock
            restartPolicy: Always
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext: &sc
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
        containers:
          runner:
            image:
              repository: data.forgejo.org/forgejo/runner
              tag: 13.2.0@sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552
            env:
              RUNNER_UUID:
                valueFrom:
                  secretKeyRef:
                    name: forgejo-runner-secret
                    key: uuid
            # args, not command: keeps the image's dumb-init ENTRYPOINT as PID 1;
            # $(RUNNER_UUID) is expanded by the kubelet, the runner has no uuid-from-file option
            args:
              - /bin/forgejo-runner
              - daemon
              - --config=/config/runner.yaml
              - --url=http://forgejo-http:3000
              - --uuid=$(RUNNER_UUID)
              - --token-url=file:///etc/runner-secret/token
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 512Mi
            securityContext: *sc
    defaultPodOptions:
      automountServiceAccountToken: true
    persistence:
      config:
        type: configMap
        name: forgejo-runner-config
        globalMounts:
          - path: /config
      plugin:
        type: emptyDir
        globalMounts:
          - path: /plugin
      runner-secret:
        type: secret
        name: forgejo-runner-secret
        globalMounts:
          - path: /etc/runner-secret
            readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /data
            subPath: data
          - path: /tmp
            subPath: tmp
    rbac:
      bindings:
        forgejo-runner:
          type: RoleBinding
          roleRef:
            identifier: forgejo-runner
          subjects:
            - identifier: forgejo-runner
      roles:
        forgejo-runner:
          type: Role
          rules:
            # Jobs - the plugin creates jobs to run pipeline steps
            - apiGroups:
                - "batch"
              resources:
                - jobs
              verbs:
                - create
                - get
                - list
                - watch
                - delete
            # Pods - only needed when the plugin needs to interact with them (logs, exec)
            - apiGroups:
                - ""
              resources:
                - pods
              verbs:
                - list
                - watch
                - get
            - apiGroups:
                - ""
              resources:
                - pods/exec
              verbs:
                - create
                - get
            - apiGroups:
                - ""
              resources:
                - pods/log
              verbs:
                - list
                - watch
                - get
    serviceAccount:
      forgejo-runner: {}
