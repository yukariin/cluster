---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pocket-id-operator
spec:
  chartRef:
    kind: OCIRepository
    name: pocket-id-operator
  interval: 1h
  values:
    operator:
      replicas: 2

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboard:
        enabled: true
        grafanaDashboard:
          enabled: true
          instanceSelector:
            matchLabels:
              dashboards: grafana

    pocket-id-instance:
      instance:
        enabled: true
        name: pocket-id
        spec:
          analyticsDisabled: true
          appUrl: "https://id.mistelinn.org"
          image: ghcr.io/pocket-id/pocket-id:v2.14.0-distroless@sha256:e0f83a42a78d0759b6d2d8c7380ef0fa8a4c95dfa01ad88740a073ae9cc4ba94
          emailNotifications:
            apiKeyExpiration: true
            loginNotification: true
            oneTimeAccessAsAdmin: true
            verification: true
          encryptionKey:
            valueFrom:
              secretKeyRef:
                name: pocket-id-operator-secret
                key: ENCRYPTION_KEY
          geoip:
            maxmindLicenseKey:
              valueFrom:
                secretKeyRef:
                  name: pocket-id-operator-secret
                  key: MAXMIND_LICENSE_KEY
          logging:
            level: "info"
            json: true
          persistence:
            enabled: true
            existingClaim: *app
          route:
            enabled: true
            name: pocket-id
            annotations:
              gatus.home-operations.com/endpoint: |-
                conditions: ["[STATUS] == 200", "len([BODY]) > 0"]
            parentRefs:
              - name: envoy-external
                namespace: network
          smtp:
            host: smtp-relay.network.svc.cluster.local
            port: 25
            from: pocket-id@mistelinn.org
            tls: none
          trustedProxies:
            enabled: true
            cidrs:
              - 10.42.0.0/16
          ui:
            sessionDuration: 1440 # 1 day
          userManagement:
            allowOwnAccountEdit: true
            allowUserSignups: "disabled"
            emailsVerified: true
          versionCheckDisabled: true

      users:
        - name: yukarin
          spec:
            admin: true
            email:
              value: "mistelinn@gmail.com"
            firstName:
              value: Yukari
            lastName:
              value: Yakumo

      userGroups:
        - name: admins
          spec:
            friendlyName: Administrators
            users:
              userRefs:
                - name: yukarin
        - name: users
          spec:
            friendlyName: Users
            users:
              userRefs:
                - name: yukarin
        - name: docs
          spec:
            friendlyName: Documents
            users:
              userRefs:
                - name: yukarin
        - name: kavita-users
          spec:
            friendlyName: Kavita Users
            customClaims:
              - key: kavita-roles
                value: "[ \"Login\", \"Download\", \"library-Book\", \"library-Light Novel\", \"library-Manga\" ]"
        - name: kavita-r18
          spec:
            friendlyName: Kavita R18 Users
            customClaims:
              - key: kavita-roles
                value: "[ \"Login\", \"Download\", \"library-Book\", \"library-Light Novel\", \"library-Manga\", \"library-[R18] Manga\", \"library-[R18] Doujinshi\" ]"
            users:
              userRefs:
                - name: yukarin
