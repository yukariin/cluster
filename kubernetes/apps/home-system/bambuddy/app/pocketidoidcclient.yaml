---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: bambuddy
spec:
  launchUrl: https://bambuddy.mistelinn.org
  callbackUrls:
    - https://bambuddy.mistelinn.org/api/v1/auth/oidc/callback
  allowedUserGroups:
    - name: admins
      namespace: security
    - name: users
      namespace: security
  pkceEnabled: true
  secret:
    keys:
      clientID: BAMBUDDY_OIDC_CLIENT_ID
      clientSecret: BAMBUDDY_OIDC_CLIENT_SECRET
      issuerUrl: BAMBUDDY_OIDC_ISSUER_URL
