# Unpackerr v1 ships a web UI/API that is on by default (0.0.0.0:5656).
# An empty env value cannot disable it (cnfg ignores empty strings), so it
# is turned off here. Starr apps stay configured via UN_* env in the HelmRelease.
# keep_history = 0 stops v1 from writing unpackerr.history.jsonl next to this
# read-only file.
keep_history = 0

[webserver]
listen_addr = ""
