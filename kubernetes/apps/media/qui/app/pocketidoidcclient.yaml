---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: qui
spec:
  launchUrl: https://qui.mistelinn.org
  callbackUrls:
    - "https://qui.mistelinn.org/api/auth/oidc/callback"
  allowedUserGroups:
    - name: users
      namespace: security
  pkceEnabled: true
  secret:
    keys:
      clientID: QUI__OIDC_CLIENT_ID
      clientSecret: QUI__OIDC_CLIENT_SECRET
