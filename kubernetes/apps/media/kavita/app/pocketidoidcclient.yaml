---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: kavita
spec:
  launchUrl: https://kavita.mistelinn.org
  callbackUrls:
    - https://kavita.mistelinn.org/signin-oidc
  logoutCallbackUrls:
    - https://kavita.mistelinn.org/signout-callback-oidc
  allowedUserGroups:
    - name: kavita-users
      namespace: security
    - name: kavita-r18
      namespace: security
  pkceEnabled: true
  skipConsent: true
  secret:
    keys:
      clientID: OAUTH_CLIENT_ID
      clientSecret: OAUTH_CLIENT_SECRET
