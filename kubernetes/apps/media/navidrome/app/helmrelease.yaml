---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: navidrome
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      navidrome:
        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        initContainers:
          download-plugins:
            image:
              repository: curlimages/curl
              tag: 8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
            command:
              - /bin/sh
              - -c
              - |
                set -u
                mkdir -p /config/plugins
                dl() { curl -fsSL --retry 3 -o "/config/plugins/$2" "$1" && echo "ok $2" || echo "skip $2 (download failed, keeping any existing copy)"; }
                # renovate: datasource=github-releases depName=navidrome/apple-music-plugin
                dl https://github.com/navidrome/apple-music-plugin/releases/download/v0.2.0/apple-music.ndp apple-music.ndp
                # renovate: datasource=github-releases depName=kgarner7/navidrome-listenbrainz-daily-playlist
                dl https://github.com/kgarner7/navidrome-listenbrainz-daily-playlist/releases/download/v6.0.0/listenbrainz-daily-playlist.ndp listenbrainz-daily-playlist.ndp
                # renovate: datasource=github-releases depName=NeptuneHub/AudioMuse-AI-NV-plugin
                dl https://github.com/NeptuneHub/AudioMuse-AI-NV-plugin/releases/download/v8/audiomuseai.ndp audiomuseai.ndp
            securityContext: &sc
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
        containers:
          app:
            image:
              repository: ghcr.io/navidrome/navidrome
              tag: 0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
            env:
              ND_AGENTS: audiomuseai,apple-music,lastfm
              ND_LASTFM_ENABLED: "true"
              ND_LISTENBRAINZ_ENABLED: "true"
              ND_BASEURL: "https://{{ .Release.Name }}.mistelinn.org"
              ND_CACHEFOLDER: /config/cache
              ND_COVERARTPRIORITY: "folder.*, cover.*, front.*"
              ND_DATAFOLDER: /config
              ND_ENABLEINSIGHTSCOLLECTOR: false
              ND_IMAGECACHESIZE: 500MB
              ND_MUSICFOLDER: /music
              ND_PORT: &port 80
              ND_SCANNER_SCHEDULE: "@every 1h"
              ND_TRANSCODINGCACHESIZE: 1GB
              ND_TRANSCODING_MAXCONCURRENT: 2
              ND_TRANSCODING_MAXCONCURRENTPERUSER: 1
              ND_ENFORCENONROOTUSER: true
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext: *sc
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 2Gi # cold cache for cover transcodes eats ram
        statefulset:
          volumeClaimTemplates:
            - name: cache
              storageClass: ceph-block
              accessMode: ReadWriteOnce
              size: 2Gi
              advancedMounts:
                app:
                  - path: /config/cache
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      media:
        type: nfs
        server: nas.internal
        path: /mnt/data_pool/data
        advancedMounts:
          navidrome:
            app:
              - path: /music
                subPath: media/music
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: "https://navidrome.mistelinn.org/ping"
            conditions: ["[STATUS] == 200", "len([BODY]) > 0"]
        hostnames:
          - "{{ .Release.Name }}.mistelinn.org"
        parentRefs:
          - {name: envoy-external, namespace: network}
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    service:
      app:
        ports:
          http:
            port: *port
