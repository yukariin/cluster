---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  chartRef:
    kind: OCIRepository
    name: ceph-csi-drivers
  interval: 1h
  values:
    operatorConfig:
      driverSpecDefaults:
        # override hook; empty = operator's built-in images, which move with the CSI operator Rook bundles
        imageSet:
          name: rook-csi-operator-image-set-configmap
        clusterName: rook-ceph
        enableMetadata: true
        controllerPlugin: &cp
          hostNetwork: true # same as Cluster's network.provider
          replicas: 2
          deploymentStrategy:
            type: Recreate
          priorityClassName: system-cluster-critical
        nodePlugin: &np
          priorityClassName: system-node-critical

    drivers:
      cephfs:
        enabled: true
        name: rook-ceph.cephfs.csi.ceph.com
        snapshotPolicy: volumeGroupSnapshot
        kernelMountOptions:
          ms_mode: prefer-crc
        controllerPlugin: *cp
        nodePlugin: *np

      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        snapshotPolicy: volumeSnapshot
        controllerPlugin: *cp
        nodePlugin: *np

      nfs:
        enabled: false

      nvmeof:
        enabled: false
