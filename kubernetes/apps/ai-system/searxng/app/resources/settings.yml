---
use_default_settings: true

general:
  instance_name: Search
  enable_metrics: false

search:
  default_lang: "en"
  formats:
    - html
    - json

server:
  # base_url, port, secret_key set via env vars
  image_proxy: true
  limiter: true
  public_instance: false

# Engines that geo/reputation-block our egress: duckduckgo (html) → CAPTCHA,
# brave → 429, startpage → captcha-block.
# duckduckgo web (lite endpoint) isn't challenged.
engines:
  - name: duckduckgo
    disabled: true
  - name: duckduckgo web
    disabled: false
  - name: brave
    disabled: true
  - name: startpage
    disabled: true
