---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-mcp-github
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: litellm-mcp-github-secret
    template:
      data:
        GITHUB_TOKEN: "{{ .OPENCLAW_TOKEN }}"
  dataFrom:
    - extract:
        key: github
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: github-mcp
spec:
  alias: github_mcp
  # GitHub's hosted server; auth is the PAT as a bearer token on every request.
  # Path modifiers: /readonly, /x/{toolset}; or X-MCP-Toolsets via params.extra_headers.
  url: https://api.githubcopilot.com/mcp/
  transport: http
  authType: bearer_token
  authTokenRef:
    name: litellm-mcp-github-secret
    key: GITHUB_TOKEN
  params:
    allow_all_keys: true
