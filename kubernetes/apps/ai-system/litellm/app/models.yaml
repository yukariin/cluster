---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/fluxcd.controlplane.io/resourceset_v1.json
# Prices come from LiteLLM's cost map (fetched from upstream main at startup,
# bundled copy as fallback), which also carries DeepSeek's off-peak windows.
# Set `pricing` only for models missing there: an unpriced model counts as $0
# against maxBudget, and any override replaces the map entry, off-peak included.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: litellm-models
spec:
  inputs:
    - model: kimi-k3
      prefix: moonshot
      apiKey: MOONSHOT_API_KEY
      maxInputTokens: 1048576
    - model: kimi-k2.7-code
      prefix: moonshot
      apiKey: MOONSHOT_API_KEY
      maxInputTokens: 262144
    - model: kimi-k2.7-code-highspeed
      prefix: moonshot
      apiKey: MOONSHOT_API_KEY
      maxInputTokens: 262144
      # USD per token, platform.kimi.ai/docs/pricing/chat
      pricing:
        input_cost_per_token: 0.0000019
        output_cost_per_token: 0.000008
        cache_read_input_token_cost: 0.00000038
    - model: kimi-k2.6
      prefix: moonshot
      apiKey: MOONSHOT_API_KEY
      maxInputTokens: 262144
    - model: deepseek-flash
      prefix: deepseek
      apiKey: DEEPSEEK_API_KEY
      maxInputTokens: 1000000
    - model: deepseek-v4-pro
      prefix: deepseek
      apiKey: DEEPSEEK_API_KEY
      maxInputTokens: 1000000
  resources:
    - apiVersion: litellm.home-operations.com/v1alpha1
      kind: LiteLLMModel
      metadata:
        name: << inputs.model | replace "." "-" >>
        namespace: ai-system
      spec:
        proxyRef: litellm
        modelName: << inputs.model >>
        params:
          model: << inputs.prefix >>/<< inputs.model >>
          apiKeyRef:
            name: litellm-secret
            key: << inputs.apiKey >>
          dropParams: true
        info:
          maxInputTokens: << inputs.maxInputTokens >>
          supportsFunctionCalling: true
          supportsPromptCaching: true
          extra: << get inputs "pricing" | default dict | toJson >>

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
# OpenRouter: one wildcard instead of a curated list; LiteLLM's bundled cost
# map prices openrouter/* ids.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: openrouter
spec:
  proxyRef: litellm
  modelName: openrouter/*
  params:
    model: openrouter/*
    apiKeyRef:
      name: litellm-secret
      key: OPENROUTER_API_KEY
    dropParams: true
