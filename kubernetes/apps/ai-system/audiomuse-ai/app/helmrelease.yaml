---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiomuse-ai
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  timeout: 15m
  values:
    controllers:
      flask:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/neptunehub/audiomuse-ai
              tag: 3.2.0@sha256:c24895c630214fcdf55ca3d5a0561d76056973beac45ed2a50022e949dcc94d9
            env: &env
              # Service
              SERVICE_TYPE: flask
              # General
              TEMP_DIR: /tmp
              CLAP_ENABLED: "true"
              ENABLE_PROXY_FIX: true
              # Backend; bootstrap only, v3 persists media-server config in DB
              MEDIASERVER_TYPE: navidrome
              NAVIDROME_URL: http://navidrome.media.svc.cluster.local
              # DB; DSN carries no ssl params so client cert auth comes from libpq env
              POSTGRES_HOST: pooler-rw.database.svc
              POSTGRES_PORT: "5432"
              POSTGRES_DB: audiomuse
              POSTGRES_USER: audiomuse
              POSTGRES_PASSWORD: ""
              PGSSLMODE: verify-full
              PGSSLCERT: /var/run/secrets/postgresql/tls.crt
              PGSSLKEY: /var/run/secrets/postgresql/tls.key
              PGSSLROOTCERT: /var/run/secrets/postgres-server-ca/ca.crt
              # Providers
              AI_MODEL_PROVIDER: NONE
            envFrom: &envFrom
              - secretRef:
                  name: audiomuse-ai-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 8000
                  initialDelaySeconds: 0
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext: &sc
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
      worker:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: *image
            env:
              <<: *env
              SERVICE_TYPE: worker
            envFrom: *envFrom
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 8Gi
            securityContext: *sc
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
          - path: /app/temp_audio
      plugins:
        type: emptyDir
        globalMounts:
          - path: /app/plugin/installed
    route:
      app:
        hostnames:
          - muse.mistelinn.org
        parentRefs:
          - {name: envoy-internal, namespace: network}
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    service:
      app:
        controller: flask
        ports:
          http:
            port: *port
