---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: audiomuse-ai-db
spec:
  dependsOn:
    - name: cluster
      namespace: database
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      inProgress: "!has(status.applied)"
      failed: status.applied == false
      current: status.applied == true
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  path: kubernetes/components/postgres/base/database
  prune: true
  postBuild:
    substitute:
      APP: audiomuse
      OWNER: audiomuse
      DATABASE_EXTENSIONS: "[{name: unaccent}, {name: pg_trgm}]"
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app audiomuse-ai
spec:
  components:
    - ../../../../components/dragonfly
    - ../../../../components/postgres/app-template
  dependsOn:
    - name: audiomuse-ai-db
    - name: dragonfly
      namespace: database
  interval: 1h
  path: kubernetes/apps/ai-system/audiomuse-ai/app
  prune: true
  postBuild:
    substitute:
      APP: *app
      PG_APP: audiomuse
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai-system
  wait: false
