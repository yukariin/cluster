---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: fluent-bit
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: prometheus # substituted into uid slots — must match the DS uid, not its name
      inputName: DS_PROMETHEUS
  configMapRef:
    name: fluent-bit-dashboard-fluent-bit
    key: fluent-bit-fluent-bit.json
