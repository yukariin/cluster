---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  interval: 1h
  values:
    fullnameOverride: victoria-metrics

    victoria-metrics-operator:
      operator:
        enable_converter_ownership: true

    defaultDashboards:
      grafanaOperator:
        enabled: true
        spec:
          allowCrossNamespaceImport: true

    defaultDatasources:
      grafanaOperator:
        enabled: true
        spec:
          allowCrossNamespaceImport: true

    vmsingle:
      spec:
        retentionPeriod: 30d
        storage:
          storageClassName: ceph-block
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
      route:
        enabled: true
        hostnames:
          - "prometheus.mistelinn.org"
        parentRefs:
          - {name: envoy-internal, namespace: network}
        extraRules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /vmui/
                  statusCode: 302
            matches:
              - path:
                  type: Exact
                  value: /

    vlsingle:
      enabled: true
      spec:
        retentionPeriod: 14d
        storage:
          storageClassName: ceph-block
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
      route:
        enabled: true
        hostnames:
          - "logs.mistelinn.org"
        parentRefs:
          - {name: envoy-internal, namespace: network}
        extraRules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /select/vmui/
                  statusCode: 302
            matches:
              - path:
                  type: Exact
                  value: /

    vmagent:
      spec:
        scrapeInterval: 1m

    vmalert:
      spec:
        evaluationInterval: 1m
        extraArgs:
          external.url: https://prometheus.mistelinn.org

    alertmanager:
      spec:
        externalURL: https://alertmanager.mistelinn.org
        # the converted VMAlertmanagerConfig routes cluster-wide alerts; without this
        # every route gets a namespace=observability matcher and cross-namespace
        # alerts fall through to the blackhole root
        disableNamespaceMatcher: true
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi
      config:
        global:
          resolve_timeout: 5m
      route:
        enabled: true
        hostnames:
          - "alertmanager.mistelinn.org"
        parentRefs:
          - {name: envoy-internal, namespace: network,}

    # control-plane scraping disabled: only per-app/cluster metrics are used
    # (kubelet/cadvisor, kube-state-metrics and node-exporter stay enabled)
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false

    defaultRules:
      groups:
        # rule groups whose inputs disappear with control-plane scraping;
        # the *Down alerts among them are absent()-based and would fire forever
        kube-apiserver-availability.rules: {enabled: false}
        kube-apiserver-burnrate.rules: {enabled: false}
        kube-apiserver-histogram.rules: {enabled: false}
        kube-apiserver-slos: {enabled: false}
        kube-scheduler.rules: {enabled: false}
        kubernetes-system-apiserver: {enabled: false}
        kubernetes-system-controller-manager: {enabled: false}
        kubernetes-system-scheduler: {enabled: false}

    grafana:
      enabled: false
      forceDeployDatasource: true
