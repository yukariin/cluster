---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  interval: 1h
  values:
    fullnameOverride: victoria-metrics

    global:
      image:
        registry: quay.io

    victoria-metrics-operator:
      operator:
        enable_converter_ownership: true
      resources:
        requests:
          cpu: 10m
          memory: 112Mi
        limits:
          memory: 192Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 5m
          memory: 80Mi
        limits:
          memory: 128Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    defaultDashboards:
      defaultTimezone: browser
      grafanaOperator:
        enabled: true
        spec:
          allowCrossNamespaceImport: true

    defaultDatasources:
      grafanaOperator:
        enabled: true
        spec:
          allowCrossNamespaceImport: true

    defaultRules:
      rules:
        etcdMemberCommunicationSlow:
          create: false
        RecordingRulesNoData:
          create: false

    vmsingle:
      spec:
        retentionPeriod: 30d
        resources:
          requests:
            cpu: 100m
            memory: 640Mi
          limits:
            memory: 1Gi
        storage:
          storageClassName: ceph-block
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
      route:
        enabled: true
        hostnames:
          - "prometheus.mistelinn.org"
        parentRefs:
          - {name: envoy-internal, namespace: network}
        extraRules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /vmui/
                  statusCode: 302
            matches:
              - path:
                  type: Exact
                  value: /

    vlsingle:
      enabled: true
      spec:
        retentionPeriod: 30d
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
        storage:
          storageClassName: ceph-block
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
      route:
        enabled: true
        hostnames:
          - "logs.mistelinn.org"
        parentRefs:
          - {name: envoy-internal, namespace: network}
        extraRules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /select/vmui/
                  statusCode: 302
            matches:
              - path:
                  type: Exact
                  value: /

    vmagent:
      spec:
        scrapeInterval: 1m
        extraArgs:
          promscrape.dropOriginalLabels: "true"
          promscrape.maxScrapeSize: 50MiB
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 384Mi

    vmalert:
      spec:
        evaluationInterval: 1m # match scrapeInterval
        extraArgs:
          external.url: https://prometheus.mistelinn.org
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi

    alertmanager:
      spec:
        externalURL: https://alertmanager.mistelinn.org
        image:
          repository: quay.io/prometheus/alertmanager
        resources:
          requests:
            cpu: 5m
            memory: 48Mi
          limits:
            memory: 96Mi
        # the converted VMAlertmanagerConfig routes cluster-wide alerts; without this
        # every route gets a namespace=observability matcher and cross-namespace
        # alerts fall through to the blackhole root
        disableNamespaceMatcher: true
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi
      # VMAlertmanagerConfig schema (snake_case), rendered as a managed CR;
      # note: no `global` key here (resolve_timeout 5m is the AM default) and
      # pushover `ttl` is not supported by the VM schema
      useManagedConfig: true
      config:
        route:
          receiver: pushover
          repeat_interval: 12h
          routes:
            - receiver: blackhole
              matchers:
                - alertname = "InfoInhibitor"
            - receiver: heartbeat
              matchers:
                - alertname = "Watchdog"
              group_interval: 5m
              group_wait: 0s
              repeat_interval: 5m
            - receiver: pushover
              matchers:
                - severity = "critical"
          group_by:
            - alertname
            - cluster
            - job
          group_interval: 5m
          group_wait: 1m
        inhibit_rules:
          - equal:
              - alertname
              - namespace
            source_matchers:
              - severity = "critical"
            target_matchers:
              - severity = "warning"
        receivers:
          - name: blackhole
          - name: heartbeat
            webhook_configs:
              - url_secret:
                  name: alertmanager-secret
                  key: HEARTBEAT_URL
          - name: pushover
            pushover_configs:
              - html: true
                send_resolved: true
                sound: gamelan
                priority: |-
                  {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
                title: >-
                  [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
                message: |-
                  {{- range .Alerts }}
                    {{- if ne .Annotations.description "" }}
                      {{ .Annotations.description }}
                    {{- else if ne .Annotations.summary "" }}
                      {{ .Annotations.summary }}
                    {{- else if ne .Annotations.message "" }}
                      {{ .Annotations.message }}
                    {{- else }}
                      Alert description not available
                    {{- end }}
                    {{- if gt (len .Labels.SortedPairs) 0 }}
                      <small>
                        {{- range .Labels.SortedPairs }}
                          <b>{{ .Name }}:</b> {{ .Value }}
                        {{- end }}
                      </small>
                    {{- end }}
                  {{- end }}
                token:
                  name: alertmanager-secret
                  key: PUSHOVER_APP_TOKEN
                user_key:
                  name: alertmanager-secret
                  key: PUSHOVER_USER_KEY
                url_title: View in Alertmanager
      route:
        enabled: true
        hostnames:
          - "alertmanager.mistelinn.org"
        parentRefs:
          - {name: envoy-internal, namespace: network,}

    kubeApiServer:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              relabelConfigs:
                - sourceLabels:
                    - "__meta_kubernetes_endpoint_node_name"
                  targetLabel: instance
              metricRelabelConfigs:
                # Drop high cardinality labels
                - action: drop
                  sourceLabels:
                    - "__name__"
                  regex: ".*_bucket"

    kubeControllerManager:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true
              metricRelabelConfigs:
                # Drop high cardinality labels
                - action: drop
                  sourceLabels:
                    - "__name__"
                  regex: ".*_bucket"

    kubeEtcd:
      enabled: true
      service:
        port: 2381
        targetPort: 2381
        selector:
          component: kube-apiserver
      vmScrape:
        spec:
          endpoints:
            - scheme: http

    kubeScheduler:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true
              metricRelabelConfigs:
                # Drop high cardinality labels
                - action: drop
                  sourceLabels:
                    - "__name__"
                  regex: ".*_bucket"

    grafana:
      enabled: false
      forceDeployDatasource: true

    extraRules:
      dockerhub-rules:
        create: true
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      oom-rules:
        create: true
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
