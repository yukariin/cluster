---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmstaticscrape_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: node-exporter
spec:
  targetEndpoints:
    - targets:
        - 192.168.90.10:9100
      path: /metrics
      relabelConfigs:
        - action: replace
          targetLabel: job
          replacement: node-exporter
        - action: replace
          targetLabel: node
          replacement: nas

---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: smartctl-exporter
spec:
  scheme: HTTP
  staticConfigs:
    - targets:
        - 192.168.90.10:9633
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: smartctl-exporter
    - action: replace
      targetLabel: node
      replacement: nas
