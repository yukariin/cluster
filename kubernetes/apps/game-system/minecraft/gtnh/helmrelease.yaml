---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gtnh
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      gtnh:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/itzg/minecraft-server
              tag: 2026.10.1@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776
            env:
              EULA: true
              TYPE: GTNH
              # Versions from https://downloads.gtnewhorizons.com/versions.json
              GTNH_PACK_VERSION: 2.9.0-RC-2
              MODS: https://github.com/GTNewHorizons/GTNH-Web-Map/releases/download/0.4-beta-1/gtnh-web-map-0.4-beta-1.jar,https://github.com/GTNewHorizons/worldedit-gtnh/releases/download/v0.0.10/worldedit-v0.0.10.jar
              # Always re-apply /config overrides, also after a pack upgrade replaces config/
              SYNC_SKIP_NEWER_IN_DESTINATION: false
              MAX_MEMORY: 8G
              SPAWN_PROTECTION: 1
              VIEW_DISTANCE: 8
              MODE: 0
              # Defaults
              BROADCAST_RCON_TO_OPS: false
              ENABLE_WHITELIST: true
              SEED: "181414113759486831"
            envFrom:
              - secretRef:
                  name: gtnh-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec: &probeExec
                    command:
                      - mc-health
                  periodSeconds: 60
              readiness: *probes
              startup:
                enabled: true
                spec:
                  exec: *probeExec
                  # first boot downloads + unpacks the ~550MB pack and generates the world
                  failureThreshold: 900
                  initialDelaySeconds: 60
                  periodSeconds: 1
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                # 8G heap + metaspace/native overhead
                memory: 10Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
      config:
        type: configMap
        name: gtnh-config
        globalMounts:
          - path: /config/GregTech/Pollution.cfg
            subPath: Pollution.cfg
            readOnly: true
          - path: /config/lootgames/games/game_of_light.cfg
            subPath: game_of_light.cfg
            readOnly: true
          - path: /config/lootgames/games/sudoku.cfg
            subPath: sudoku.cfg
            readOnly: true
      tmpfs:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp
    route:
      gtnh-map:
        hostnames:
          - "{{ .Release.Name }}-map.mistelinn.org"
        parentRefs:
          - {name: envoy-internal, namespace: network}
        rules:
          - backendRefs:
              - identifier: app
                port: map
    service:
      app:
        controller: gtnh
        annotations:
          external-dns.kubernetes.io/hostname: gtnh.mistelinn.org
          external-dns.kubernetes.io/target: mc-router.mistelinn.org
          mc-router.itzg.me/externalServerName: gtnh.mistelinn.org
        ports:
          minecraft:
            port: 25565
          map:
            port: 8123
          rcon:
            port: 25575
