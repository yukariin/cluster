---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/docker-compose.json
services:
  tftpd:
    image: registry.gitlab.com/kalaksi-containers/tftpd:1.6@sha256:8db9f5771c37c0f4bec0e93a752a0803a74593865c379db70aedda8c7ef300b7
    container_name: tftpd
    restart: unless-stopped
    environment:
      TFTPD_BIND_ADDRESS: "0.0.0.0:1069"
      TFTPD_EXTRA_ARGS: "--blocksize 1468"
    volumes:
      - ${APPS_DATASET:-/mnt/data_pool/app}/tftpd/data:/tftpboot
    ports:
      - "69:1069/udp"
    # security
    cap_drop:
      - all
    cap_add:
      - CAP_SETGID
      - CAP_SETUID
      - CAP_SYS_CHROOT
    security_opt:
      - no-new-privileges
    read_only: true
